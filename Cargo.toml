[package]
name = "curriculum"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/Curriculum"
description = "Curriculum skill registry and Nexus."
publish = false
build = "build.rs"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "signal-curriculum-nexus/datom"]

[[bin]]
name = "curriculum"
path = "src/main.rs"
required-features = ["datom"]

[[bin]]
name = "curriculum-nexus"
path = "src/nexus_main.rs"

[dependencies]
sha2 = "=0.10.9"
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", features = ["rkyv"], optional = true }
nexus = { git = "https://github.com/LiGoldragon/nexus", rev = "ec097e315a3b0b99bc215a72f6c3f6d8b2b060cf" }
# The wire contract: Input, Output and the Answering capabilities.
signal-curriculum-nexus = { git = "https://github.com/LiGoldragon/signal-curriculum-nexus", rev = "4358aa1" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "signal"] }
# The build base builds mio with its default log feature everywhere; this crate carries that edge.
mio = "1"

# curriculum.ethos, memory.ethos and emission.ethos are generated into
# src/generated.rs, src/memory.rs and src/emission.rs by ethos-zero; the build script fails when the committed Rust
# differs from fresh generation. The rev string is the one Flow and the
# contract write, so one ethos-zero source stands in every graph.
[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "8c95310" }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "nexus_roundtrip"
path = "tests/nexus_roundtrip.rs"
required-features = ["datom"]

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
